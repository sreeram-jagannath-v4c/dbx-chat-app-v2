bundle:
  name: databricks-chatbot

# -----------------------------------------------------------------------------
# Variables
# -----------------------------------------------------------------------------
variables:
  serving_endpoint_name:
    description: "Name of the model serving endpoint to be used by the app"
    default: "ka-39fe1d5a-endpoint"

  database_instance_name:
    description: "Base name of the Lakebase database instance"
    default: "chatbot-lakebase-v3"

  resource_name_suffix:
    description: "Suffix for resource names (app/lakebase instance names etc). Helpful for avoiding name collisions if multiple users deploy this app to the same workspace"

  pdf_volume_name:
    description: "Full Unity Catalog path to the PDF volume"
    default: "poc.agent_files.all_files"

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  database_instances:
    chatbot_lakebase:
      name: ${var.database_instance_name}-${var.resource_name_suffix}
      capacity: CU_1

  apps:
    databricks_chatbot:
      name: db-chatbot-dev2
      description: "Agentic Chat application for Foundation Models, Agent Bricks, and custom code agents"
      source_code_path: ${workspace.file_path}

      user_api_scopes:
        - model-serving
        - files.files

      resources:
        # Model serving endpoint (knowledge agent).
        # NOTE: For an Agent Bricks Multi-Agent Supervisor, also grant the app
        # service principal CAN_QUERY on the underlying agent endpoints by
        # adding them as additional resources here.
        # https://docs.databricks.com/aws/en/generative-ai/agent-bricks/multi-agent-supervisor
        - name: serving-endpoint
          description: "Databricks serving endpoint name for the AI agent"
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_MANAGE

        # Unity Catalog volume holding the PDFs used for citations and preview.
        - name: pdf-volume
          uc_securable:
            securable_full_name: ${var.pdf_volume_name}
            securable_type: VOLUME
            permission: READ_VOLUME

        # Lakebase database for persistent chat history.
        - name: database
          description: "Lakebase database instance for the chat app"
          database:
            database_name: databricks_postgres
            instance_name: ${resources.database_instances.chatbot_lakebase.name}
            permission: CAN_CONNECT_AND_CREATE

        # MLflow experiment for the feedback widget (requires the database above).
        # To find the ID: npx tsx scripts/get-experiment-id.ts --endpoint <endpoint-name>
        - name: experiment
          description: "MLflow experiment for collecting user feedback"
          experiment:
            experiment_id: "2378321935419041"
            permission: CAN_EDIT

# -----------------------------------------------------------------------------
# Targets
# -----------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: dev-${workspace.current_user.domain_friendly_name}

  staging:
    mode: production
    variables:
      resource_name_suffix: "staging"

  prod:
    mode: production
    variables:
      resource_name_suffix: "prod"